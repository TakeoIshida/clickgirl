name: Temporary RecipeClip App Store Deploy

on:
  workflow_dispatch:

concurrency:
  group: temporary-recipeclip-app-store-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout RecipeClip
        uses: actions/checkout@v4
        with:
          repository: TakeoIshida/RecipeClip
          ref: main

      - name: Select Xcode 26
        shell: bash
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "Xcode 26 is required but was not found on this runner."
            ls /Applications | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/build.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/build.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$RUNNER_TEMP/build.keychain-db" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$RUNNER_TEMP/build.keychain-db"

      - name: Set up App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode \
            -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ruby -rjson -e 'File.write(ARGV[1], JSON.generate({key_id: ENV.fetch("ASC_KEY_ID"), issuer_id: ENV.fetch("ASC_ISSUER_ID"), key: File.read(ARGV[0]), in_house: false}))' \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "$RUNNER_TEMP/asc_api_key.json"

      - name: Create and install App Store profiles
        run: |
          mkdir -p "$RUNNER_TEMP/profiles"
          fastlane sigh \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier "com.ishidatakeo.RecipeClip" \
            --force \
            --output_path "$RUNNER_TEMP/profiles" \
            --filename "RecipeClip_AppStore.mobileprovision"
          fastlane sigh \
            --api_key_path "$RUNNER_TEMP/asc_api_key.json" \
            --app_identifier "com.ishidatakeo.RecipeClip.ShareExtension" \
            --force \
            --output_path "$RUNNER_TEMP/profiles" \
            --filename "RecipeClip_ShareExtension_AppStore.mobileprovision"

      - name: Build archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project RecipeClip.xcodeproj \
            -scheme RecipeClip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RecipeClip.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            DEVELOPMENT_TEAM=JS3245KG7Q

      - name: Export IPA
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :signingStyle manual" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string 'Apple Distribution'" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.ishidatakeo.RecipeClip string 'com.ishidatakeo.RecipeClip AppStore'" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.ishidatakeo.RecipeClip.ShareExtension string 'com.ishidatakeo.RecipeClip.ShareExtension AppStore'" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RecipeClip.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/output"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/output" -maxdepth 1 -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "Exported IPA was not found."
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
