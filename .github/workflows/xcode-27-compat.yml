name: Xcode 27 Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-27-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "iOS SDK: ${SDK_VERSION}"
          if (( SDK_MAJOR < 27 )); then
            echo "Expected iOS SDK 27 or later, found ${SDK_VERSION}." >&2
            exit 1
          fi

      - name: Install CocoaPods dependencies
        working-directory: ClickGirl
        run: pod install

      - name: Build ClickGirl for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace ClickGirl/ClickGirl.xcworkspace \
            -scheme ClickGirl \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ClickGirlDerived" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Write compatibility summary
        if: always()
        run: |
          {
            echo "## Xcode 27 compatibility"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "- Production deployment and App Store upload were not executed."
          } >> "$GITHUB_STEP_SUMMARY"
